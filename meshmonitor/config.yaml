name: "MeshMonitor"
description: "Meshtastic Monitoring Dashboard"
version: "4.17.2"
slug: "meshmonitor"
url: https://github.com/MrCheng888/meshmonitor-ha
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:radio-handheld
panel_title: "MeshMonitor"
options:
  connection_type: "tcp"
  MESHTASTIC_NODE_IP: "192.168.1.231"
  MESHTASTIC_TCP_PORT: 4403
  MESHTASTIC_SERIAL_PORT: "/dev/ttyUSB0"
  SESSION_SECRET: "meshmonitor-secret-key-2024"
  DISABLE_ANONYMOUS: false
  HA_LOGIN: false
  HA_ADMINS: ""
schema:
  connection_type: list(tcp|serial)
  MESHTASTIC_NODE_IP: str
  MESHTASTIC_TCP_PORT: port
  MESHTASTIC_SERIAL_PORT: str
  SESSION_SECRET: str
  DISABLE_ANONYMOUS: bool
  HA_LOGIN: bool?
  HA_ADMINS: str?
ports:
  4404/tcp: 4404
  4405/tcp: 4405
  4406/tcp: 4406
  4407/tcp: 4407
ports_description:
  4404/tcp: Virtual Node Server (for Meshtastic mobile apps)
  4405/tcp: Virtual Node Server 2 (second source)
  4406/tcp: Virtual Node Server 3 (third source)
  4407/tcp: Virtual Node Server 4 (fourth source)
devices:
  - /dev/ttyUSB0
  - /dev/ttyUSB1
  - /dev/ttyACM0
  - /dev/ttyACM1
