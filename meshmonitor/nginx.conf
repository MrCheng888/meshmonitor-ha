# HA_LOGIN: user name handed over by the Home Assistant ingress
# (X-Remote-User-Name). Empty when the header is absent, so no user is created.
map $http_x_remote_user_name $ha_login_user {
    ""      "";
    default "ha-$http_x_remote_user_name@homeassistant";
}

server {
    listen 8099;

    # Only the Supervisor ingress gateway may talk to this port.
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3001$http_x_ingress_path$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never pass client-supplied SSO headers through to MeshMonitor.
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header __HA_LOGIN_HEADER__ $ha_login_user;

        # MeshMonitor sends "X-Frame-Options: DENY" unless IFRAME_ALLOWED_ORIGINS is set,
        # which blocks the HA ingress iframe. Ingress is same-origin with HA, so allow
        # framing by the same origin only.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
